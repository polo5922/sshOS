[package]
name = "sshos-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sshos-shared = { path = "../shared" }
leptos = { version = "0.8", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDivElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "PointerEvent", "MouseEvent", "KeyboardEvent", "Event", "EventTarget", "DomRect", "Storage", "CssStyleDeclaration", "MediaQueryList", "Location", "Element", "NodeList", "ResizeObserver"] }
console_error_panic_hook = "0.1"
