[workspace]
resolver = "2"
members = ["shared", "src-tauri", "frontend"]
default-members = ["shared", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
